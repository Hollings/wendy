<!DOCTYPE html>
<html>
<head>
<title>Collatz Tree</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#040408; overflow:hidden; font-family:monospace; color:#889; }
canvas { display:block; }
#ui {
  position:fixed; top:14px; left:16px;
  font-size:11px; color:#446; line-height:1.8;
}
#ui b { color:#667; }
#controls {
  position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; align-items:center; font-size:11px; color:#446;
}
input[type=range] { width:120px; accent-color:#4455aa; }
label { color:#556; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <b>Collatz Tree</b><br>
  3n+1 conjecture — all paths lead to 1<br>
  color = stopping time
</div>
<div id="controls">
  <label>nodes: <span id="nval">2000</span></label>
  <input type="range" id="nslider" min="100" max="8000" value="2000" step="100">
  <label>spread: <span id="sval">1.0</span></label>
  <input type="range" id="sslider" min="30" max="200" value="100" step="5">
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, nodes = [], edges = [], maxDepth = 0;
let pan = {x:0, y:0}, zoom = 1;
let dragging = false, dragStart = {x:0, y:0}, panStart = {x:0, y:0};
let N = 2000, spread = 1.0;

// Build reverse Collatz tree from 1
function buildTree(maxN) {
  const parent = new Map(); // child → parent
  const depth = new Map();  // n → depth
  const children = new Map();

  depth.set(1, 0);
  const queue = [1];
  const visited = new Set([1]);

  while (queue.length && visited.size < maxN) {
    const n = queue.shift();
    const d = depth.get(n);

    // Predecessors of n: always 2n (even predecessor)
    const even = 2 * n;
    if (even <= maxN * 3 && !visited.has(even)) {
      visited.add(even);
      parent.set(even, n);
      depth.set(even, d + 1);
      if (!children.has(n)) children.set(n, []);
      children.get(n).push(even);
      queue.push(even);
    }

    // Odd predecessor: (n-1)/3 if (n-1)%3==0 and (n-1)/3 is odd and > 1
    if (n > 1 && (n - 1) % 3 === 0) {
      const odd = (n - 1) / 3;
      if (odd > 1 && odd % 2 === 1 && odd <= maxN * 3 && !visited.has(odd)) {
        visited.add(odd);
        parent.set(odd, n);
        depth.set(odd, d + 1);
        if (!children.has(n)) children.set(n, []);
        children.get(n).push(odd);
        queue.push(odd);
      }
    }
  }

  return { parent, depth, children, visited };
}

// Radial tree layout
function radialLayout(root, children, depth) {
  const pos = new Map();
  const maxD = Math.max(...depth.values());

  function layout(node, angle, span, d) {
    const r = d === 0 ? 0 : Math.pow(d / maxD, 0.7) * 380 * spread;
    pos.set(node, {
      x: Math.cos(angle) * r,
      y: Math.sin(angle) * r
    });

    const ch = children.get(node) || [];
    if (ch.length === 0) return;

    let a = angle - span / 2;
    const step = span / ch.length;
    for (const c of ch) {
      layout(c, a + step / 2, step * 0.95, d + 1);
      a += step;
    }
  }

  layout(root, -Math.PI / 2, Math.PI * 2, 0);
  return pos;
}

function depthToColor(d, maxD) {
  const t = d / maxD;
  // Deep blue → cyan → green → yellow → red
  const stops = [
    [0.05, 0.05, 0.2],   // deep blue (shallow)
    [0.0,  0.4,  0.8],   // cyan
    [0.1,  0.7,  0.3],   // green
    [0.9,  0.8,  0.1],   // yellow
    [0.9,  0.1,  0.1],   // red (deep)
  ];
  const i = Math.min(Math.floor(t * (stops.length - 1)), stops.length - 2);
  const f = t * (stops.length - 1) - i;
  const a = stops[i], b = stops[i+1];
  const r = Math.round((a[0] + (b[0]-a[0])*f) * 255);
  const g = Math.round((a[1] + (b[1]-a[1])*f) * 255);
  const bl = Math.round((a[2] + (b[2]-a[2])*f) * 255);
  return `rgb(${r},${g},${bl})`;
}

let pos, depthMap, parentMap;

function rebuild() {
  const { parent, depth, children, visited } = buildTree(N);
  depthMap = depth;
  parentMap = parent;
  maxDepth = Math.max(...depth.values());
  pos = radialLayout(1, children, depth);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W/2 + pan.x, H/2 + pan.y);
  ctx.scale(zoom, zoom);

  // Draw edges
  ctx.lineWidth = 0.4 / zoom;
  ctx.globalAlpha = 0.35;
  for (const [child, par] of parentMap) {
    const a = pos.get(child), b = pos.get(par);
    if (!a || !b) continue;
    const d = depthMap.get(child);
    ctx.strokeStyle = depthToColor(d, maxDepth);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Draw nodes
  ctx.globalAlpha = 1;
  const r = Math.max(0.8, 2.5 / zoom);
  for (const [n, p] of pos) {
    const d = depthMap.get(n);
    ctx.fillStyle = depthToColor(d, maxDepth);
    ctx.beginPath();
    ctx.arc(p.x, p.y, n === 1 ? r*2.5 : r, 0, Math.PI*2);
    ctx.fill();
  }

  // Label root
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#fff';
  ctx.font = `${12/zoom}px monospace`;
  ctx.textAlign = 'center';
  const root = pos.get(1);
  if (root) ctx.fillText('1', root.x, root.y - 8/zoom);

  ctx.restore();

  // Legend
  const lx = W - 140, ly = 16;
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    ctx.fillStyle = depthToColor(t * maxDepth, maxDepth);
    ctx.fillRect(lx, ly + i*14, 12, 10);
    ctx.fillStyle = '#446';
    ctx.fillText(i === 0 ? 'shallow' : i === 4 ? 'deep' : '', lx + 16, ly + i*14 + 9);
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}

// Controls
document.getElementById('nslider').addEventListener('input', e => {
  N = parseInt(e.target.value);
  document.getElementById('nval').textContent = N;
  rebuild(); draw();
});
document.getElementById('sslider').addEventListener('input', e => {
  spread = parseInt(e.target.value) / 100;
  document.getElementById('sval').textContent = spread.toFixed(1);
  rebuild(); draw();
});

// Pan/zoom
canvas.addEventListener('mousedown', e => { dragging = true; dragStart = {x:e.clientX, y:e.clientY}; panStart = {...pan}; });
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  pan.x = panStart.x + (e.clientX - dragStart.x);
  pan.y = panStart.y + (e.clientY - dragStart.y);
  draw();
});
document.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.85 : 1.18;
  zoom = Math.max(0.05, Math.min(50, zoom * factor));
  draw();
}, {passive:false});

window.addEventListener('resize', resize);
rebuild();
resize();
</script>
</body>
</html>
